workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ystrad Rhondda App Store Connect
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.domtt30.rugbyscorekeeper
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Build signed iOS app
        script: flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
